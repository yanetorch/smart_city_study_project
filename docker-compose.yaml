services:
  # ---------- 1. Identity & Auth ----------
  auth_service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    # --root-path /api/auth ставить только для работы со Swaggerпо адресу /api/auth/docs
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    # ports:
    #   - "8001:8000" # без nginx
    env_file:
      - ./services/auth-service/config.env
    environment:
      # в конфиге @localhost, а для докера @auth_db
      - DATABASE_URL=postgresql+asyncpg://admin:123@auth_db:5432/identifyandauth
    depends_on:
      auth_db:
        condition: service_healthy

  # БД auth-сервиса
  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: identifyandauth
    volumes:
      # чтобы данные не терялись при перезапуске контейнера
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identifyandauth"]
      interval: 3s
      timeout: 3s
      retries: 20
    # ports:
    #   - "5433:5432" # WSL

  # ---------- 2. Transport ----------
  transport_service:
    build:
      context: ./services/transport-service
    # ports:
    #   - "8002:8000" # без nginx
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@transport_db:5432/transport
      - AUTH_SERVICE_URL=http://auth_service:8000
      - NOTIFICATION_SERVICE_URL=http://notification_service:8000
      - ROOT_PATH=/api/transport
    depends_on:
      transport_db:
        condition: service_healthy

  transport_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: transport
    volumes:
      - transport_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transport"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------- 3. Utility (ЖКХ) ----------
  utility_service:
    build:
      context: ./services/utility-service
    # ports:
    #   - "8003:8000" # без nginx
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@utility_db:5432/utility
      - AUTH_SERVICE_URL=http://auth_service:8000
      - NOTIFICATION_SERVICE_URL=http://notification_service:8000
      - ROOT_PATH=/api/utility
    depends_on:
      utility_db:
        condition: service_healthy

  utility_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: utility
    volumes:
      - utility_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d utility"]
      interval: 3s
      timeout: 3s
      retries: 20
  

# ---------- 4. Notification ----------
  notification_service:
    build:
      context: ./services/notification-service
    environment:
      SERVICE_NAME: notification-service
      DRY_RUN: "true"
      AUTH_SERVICE_URL: http://auth_service:8000
      SERVICE_API_KEY: 9unjXDAUDVI9uPp6GVyEGGmE2eLFo_6VdKVesoi3TWih6jfkPLN3Z9d73OAZnhU7
    depends_on:
      - auth_service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - transport_service
      - utility_service
      - frontend

volumes:
  auth_data:
  transport_data:
  utility_data:
  frontend_dist:
