services:
  # ---------- 1. Identity & Auth ----------
  auth_service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    # --root-path /api/auth ставить только для работы со Swaggerпо адресу /api/auth/docs
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    # ports:
    #   - "8001:8000" # без nginx
    env_file:
      - ./services/auth-service/config.env
    environment:
      # в конфиге @localhost, а для докера @auth_db
      - DATABASE_URL=postgresql+asyncpg://admin:123@auth_db:5432/identifyandauth
      - SERVICE_NAME=auth
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      auth_db:
        condition: service_healthy

  # БД auth-сервиса
  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: identifyandauth
    volumes:
      # чтобы данные не терялись при перезапуске контейнера
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identifyandauth"]
      interval: 3s
      timeout: 3s
      retries: 20
    # ports:
    #   - "5433:5432" # WSL

  # ---------- 2. Transport ----------
  transport_service:
    build:
      context: ./services/transport-service
    # ports:
    #   - "8002:8000" # без nginx
    env_file:
      - ./services/transport-service/config.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@transport_db:5432/transport
      - SERVICE_NAME=transport
      - AUTH_SERVICE_URL=http://auth_service:8000
      - NOTIFICATION_SERVICE_URL=http://notification_service:8000
      - ROOT_PATH=/api/transport
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      transport_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  transport_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: transport
    volumes:
      - transport_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transport"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------- 3. Utility (ЖКХ) ----------
  utility_service:
    build:
      context: ./services/utility-service
    # ports:
    #   - "8003:8000" # без nginx
    env_file:
      - ./services/utility-service/config.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@utility_db:5432/utility
      - SERVICE_NAME=utility
      - AUTH_SERVICE_URL=http://auth_service:8000
      - NOTIFICATION_SERVICE_URL=http://notification_service:8000
      - ROOT_PATH=/api/utility
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      utility_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  utility_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: utility
    volumes:
      - utility_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d utility"]
      interval: 3s
      timeout: 3s
      retries: 20
  

# ---------- 4. Notification ----------
  notification_service:
    build:
      context: ./services/notification-service
    env_file:
      - ./services/notification-service/config.env
    environment:
      - SERVICE_NAME=notification
      - AUTH_SERVICE_URL=http://auth_service:8000
      - DRY_RUN=true
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      auth_service:
        condition: service_started
    restart: unless-stopped


# ---------- 5. Environment ----------
  environment_service:
    build:
      context: ./services/environment-service
    env_file:
      - ./services/environment-service/config.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@environment_db:5432/environment
      - SECRET_KEY=change-me
      - SERVICE_NAME=environment
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      environment_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  environment_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: environment
    volumes:
      - environment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d environment"]
      interval: 3s
      timeout: 3s
      retries: 20

# ---------- 6. Billing ----------
  billing_service:
    build:
      context: ./services/billing-service
    env_file:
      - ./services/billing-service/config.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:123@billing_db:5432/billing
      - SECRET_KEY=change-me
      - SERVICE_NAME=billing
      - SERVICE_REGISTRATION_TOKEN=${SERVICE_REGISTRATION_TOKEN}
    depends_on:
      billing_db:
        condition: service_healthy
      auth_service:
          condition: service_started

  billing_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: billing
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d billing"]
      interval: 3s
      timeout: 3s
      retries: 20


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - transport_service
      - utility_service
      - frontend

volumes:
  auth_data:
  transport_data:
  utility_data:
  frontend_dist:
  environment_data:
  billing_data:
