server {
    listen 80;
    server_name localhost;

    # общие заголовки для всех проксируемых запросов
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Слэш в конце proxy_pass срезает префикс:
    # /api/transport/vehicles -> http://transport_service:8000/vehicles

    # 1. Identity & Auth
    location /api/auth/ {
        proxy_pass http://auth_service:8000/;
    }

    # 2. Transport
    location /api/transport/ {
        proxy_pass http://transport_service:8000/;
    }

    # 3. Utility (ЖКХ)
    location /api/utility/ {
        proxy_pass http://utility_service:8000/;
    }

    # 4-6. Environment / Billing / Notification — добавить по аналогии
    # location /api/environment/ { proxy_pass http://environment_service:8000/; }

    # / оставлен под фронтенд (Vue)
}
